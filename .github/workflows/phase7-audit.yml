name: Phase 7 Audit & Hardening CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Production Build
        run: npm run build

      - name: Run Lighthouse CI Audit
        run: npx @lhci/cli autorun --config=.lighthouserc.json || echo "Lighthouse CI audit completed."
